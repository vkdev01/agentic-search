# Chat models the UI can pick from (the model menu in the composer).
#
# Every provider below speaks the OpenAI Chat Completions API (kind: openai). That covers OpenAI,
# Gemini and Anthropic (via their OpenAI-compatible endpoints), Groq, Mistral, DeepSeek, OpenRouter,
# Together, Sarvam, and local servers like Ollama, LM Studio and vLLM. Other API styles need an
# adapter in src/agentic_search_api/providers/llm/factory.py.
#
# A provider is enabled when it needs no key or its api_key_env is set (in the environment or .env).
# Models are picked by id "<provider>/<model>", e.g. "ollama/qwen3:8b". Edits apply on the next request.
#
# Provider fields
#   label            name shown in the model menu
#   kind             adapter: "openai" (default) for any OpenAI-compatible API
#   base_url         API root, e.g. https://api.openai.com/v1
#   base_url_env     optional variable that overrides base_url (useful in Docker)
#   api_key_env      variable holding the API key; omit for local servers
#   api_key_headers  extra headers that must also carry the key
#   local            runs on your machine (badge in the menu, cost counted as 0)
#   discover         also list every model from GET {base_url}/models (e.g. all pulled Ollama models)
#   include          glob filters for discovered model names, e.g. ["llama-3*"]
#   context_window, max_tokens, json_extra, stream_extra   defaults for this provider's models
#
# Model fields: id (the provider's model name), label, context_window, max_tokens, reasoning,
#   json_extra / stream_extra (extra request fields for planning / answering),
#   price_input_per_mtok / price_output_per_mtok (shown as session cost in PRICE_CURRENCY)

default_model: sarvam/sarvam-105b

providers:
  sarvam:
    label: Sarvam
    base_url: https://api.sarvam.ai/v1
    api_key_env: SARVAM_API_KEY
    api_key_headers: [api-subscription-key]
    models:
      - id: sarvam-105b
        label: Sarvam 105B
        context_window: 128000
        # Reasoning tokens count against max_tokens, so leave room for thinking + answer.
        max_tokens: 16384
        reasoning: true
        # Planning is a small JSON task, so skip reasoning there.
        json_extra: { reasoning_effort: null }
        stream_extra: { reasoning_effort: low }

  ollama:
    label: Ollama
    base_url: http://localhost:11434/v1
    base_url_env: OLLAMA_BASE_URL
    local: true
    discover: true
    # Must match the server's context length: start it with `OLLAMA_CONTEXT_LENGTH=8192 ollama serve`
    # (Ollama otherwise picks a default from GPU memory, e.g. 4096 on an 18 GB Mac).
    context_window: 8192

